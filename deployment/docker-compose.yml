services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: dgecc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgecc_rag}
      POSTGRES_USER: ${POSTGRES_USER:-dgecc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "5432:5432"
    volumes:
      - dgecc_pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - dgecc_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dgecc_admin} -d ${POSTGRES_DB:-dgecc_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dgecc-app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: dgecc_app
    restart: unless-stopped
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    environment:
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dgecc_admin}:${POSTGRES_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-dgecc_rag}
    ports:
      - "3000:3000"
    volumes:
      - dgecc_uploads:/app/data

volumes:
  dgecc_pgdata:
  dgecc_backups:
  dgecc_uploads:
